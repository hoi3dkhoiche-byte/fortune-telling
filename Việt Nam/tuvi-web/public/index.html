<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F5F5F7">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
  <title>THIÊN KỶ — Lập Lá Số Tử Vi Đẩu Số</title>
  <link rel="stylesheet" href="/css/styles.css?v=apple-hig-v1">
</head>
<body>
  <!-- Lớp ánh sáng nền tinh tế (tự động tắt khi reduced-motion) -->
  <canvas id="starfield-canvas" aria-hidden="true"></canvas>

  <div class="app-container">
    <!-- Thanh điều hướng kính mờ kiểu macOS / iOS -->
    <header class="app-header">
      <div class="brand">
        <h1 class="brand-title">Thiên Kỷ</h1>
        <span class="brand-sub">Tử Vi Đẩu Số</span>
      </div>

      <div class="header-badges">
        <span class="badge-tag" id="profile-badge"></span>
        <span class="badge-tag sample hidden" id="sample-badge">Lá số mẫu</span>
        <span class="badge-tag candidate hidden" id="imported-badge">Mở từ file · Chưa kiểm tra lại</span>
        <button class="btn-icon-pill" id="theme-toggle-btn" type="button" aria-label="Chuyển chế độ Sáng hoặc Tối">Tối</button>
      </div>
    </header>

    <!-- Thông báo trạng thái toàn cục -->
    <div id="global-alert-container" class="global-alert-wrap" aria-live="polite"></div>

    <!-- ======================================================================
         MÀN HÌNH 1: NHẬP DỮ KIỆN LẬP SỐ (APPLE INSET GROUPED SHEET)
         ====================================================================== -->
    <section class="view-screen" id="view-input">
      <div class="input-screen-wrapper">
        <div class="portal-card">
          <div class="portal-header">
            <h2 class="portal-title">Lập lá số bản mệnh</h2>
            <p class="portal-desc">Nhập ngày giờ sinh chính xác để khởi tạo tinh bàn Tử Vi Đẩu Số theo hệ phái Thiên Kỷ.</p>
          </div>

          <form id="birth-form" class="apple-form" novalidate>
            <!-- Họ tên -->
            <div class="form-group">
              <label class="form-label" for="user-name">Họ tên đương số <span class="label-optional">Tùy chọn</span></label>
              <input class="form-input" type="text" id="user-name" placeholder="Ví dụ: Nguyễn Văn A" maxlength="60" autocomplete="name" />
            </div>

            <!-- Hệ thống lịch: Dương / Âm -->
            <div class="form-group">
              <label class="form-label">Hệ thống lịch sinh</label>
              <div class="segmented-control" role="radiogroup" aria-label="Hệ thống lịch sinh">
                <label class="segmented-btn active" id="lbl-cal-solar">
                  <input type="radio" name="calendar" value="solar" checked class="sr-only" />
                  Dương lịch
                </label>
                <label class="segmented-btn" id="lbl-cal-lunar">
                  <input type="radio" name="calendar" value="lunar" class="sr-only" />
                  Âm lịch
                </label>
              </div>
            </div>

            <!-- Ngày Dương lịch -->
            <div class="form-group" id="solar-date-group">
              <label class="form-label" for="solar-date">Ngày sinh (Dương lịch)</label>
              <input class="form-input" type="date" id="solar-date" value="1990-01-01" min="1900-01-01" max="2050-12-31" required />
            </div>

            <!-- Ngày Âm lịch -->
            <div class="form-group" id="lunar-date-group" style="display: none;">
              <label class="form-label">Ngày sinh (Âm lịch)</label>
              <div class="row-3">
                <input class="form-input" type="number" inputmode="numeric" id="lunar-day" placeholder="Ngày" min="1" max="30" value="1" />
                <input class="form-input" type="number" inputmode="numeric" id="lunar-month" placeholder="Tháng" min="1" max="12" value="1" />
                <input class="form-input" type="number" inputmode="numeric" id="lunar-year" placeholder="Năm" min="1900" max="2050" value="1990" />
              </div>
              <label class="checkbox-label checkbox-spaced">
                <input type="checkbox" id="lunar-leap" />
                <span>Sinh vào tháng nhuận</span>
              </label>
            </div>

            <!-- Giờ sinh & Chưa rõ giờ sinh -->
            <div class="form-group">
              <div class="form-label">
                <span>Giờ &amp; phút sinh</span>
                <label class="checkbox-label">
                  <input type="checkbox" id="unknown-time" />
                  <span>Chưa rõ giờ sinh</span>
                </label>
              </div>
              <input class="form-input" type="time" id="birth-time" aria-label="Giờ và phút sinh" />
            </div>

            <!-- Giới tính -->
            <div class="form-group">
              <label class="form-label">Giới tính</label>
              <div class="segmented-control" role="radiogroup" aria-label="Giới tính">
                <label class="segmented-btn active" id="lbl-gender-male">
                  <input type="radio" name="gender" value="male" checked class="sr-only" />
                  Nam mệnh
                </label>
                <label class="segmented-btn" id="lbl-gender-female">
                  <input type="radio" name="gender" value="female" class="sr-only" />
                  Nữ mệnh
                </label>
              </div>
            </div>

            <!-- Múi giờ nơi sinh -->
            <div class="form-group">
              <label class="form-label" for="tz-select">Múi giờ nơi sinh</label>
              <select class="form-select" id="tz-select">
                <option value="Asia/Ho_Chi_Minh" selected>Asia/Ho_Chi_Minh (Việt Nam)</option>
                <option value="Asia/Bangkok">Asia/Bangkok (Thái Lan UTC+7)</option>
                <option value="Etc/GMT-7">Etc/GMT-7 (Cố định UTC+7)</option>
                <option value="Asia/Singapore">Asia/Singapore (Singapore UTC+8)</option>
                <option value="Asia/Tokyo">Asia/Tokyo (Nhật Bản UTC+9)</option>
                <option value="Europe/Paris">Europe/Paris (Pháp / Tây Âu)</option>
                <option value="America/New_York">America/New_York (Mỹ - Miền Đông)</option>
                <option value="America/Los_Angeles">America/Los_Angeles (Mỹ - Miền Tây)</option>
                <option value="custom">Nhập mã múi giờ IANA tùy chọn…</option>
              </select>
            </div>

            <div class="form-group" id="tz-custom-group" style="display: none;">
              <label class="form-label" for="tz-custom">Mã IANA Zone</label>
              <input class="form-input" type="text" id="tz-custom" placeholder="Ví dụ: Australia/Sydney" autocapitalize="none" autocorrect="off" />
            </div>

            <!-- Tùy chọn nâng cao -->
            <div class="form-group advanced-group">
              <button class="btn btn-disclosure" id="adv-toggle" type="button" aria-controls="adv-content" aria-expanded="false">
                <span class="toggle-icon">▸</span>
                <span>Tùy chọn nâng cao</span>
              </button>
              <div class="collapsed adv-panel" id="adv-content" style="display: none; flex-direction: column; gap: 10px;">
                <div class="row-2 hidden" id="place-coordinates">
                  <input class="form-input" type="number" inputmode="decimal" id="place-lat" aria-label="Vĩ độ nơi sinh" placeholder="Vĩ độ" min="-90" max="90" step="any" disabled />
                  <input class="form-input" type="number" inputmode="decimal" id="place-lon" aria-label="Kinh độ nơi sinh" placeholder="Kinh độ" min="-180" max="180" step="any" disabled />
                </div>
                <select class="form-select" id="cal-convention" aria-label="Quy ước lịch">
                  <option value="" selected>Tự động so sánh lịch (Mặc định)</option>
                  <option value="vietnamese">Quy ước Lịch Việt Nam (vietnamese)</option>
                  <option value="chinese">Quy ước Lịch Trung Quốc (chinese)</option>
                </select>
                <select class="form-select" id="profile-select" aria-label="Cấu hình lập số">
                  <option value="thienky-candidate" selected>thienky-candidate · Đang kiểm chứng</option>
                  <option value="repro-v4">repro-v4 · Đối chiếu dataset</option>
                </select>
              </div>
            </div>

            <!-- Hành động khởi tạo -->
            <div class="form-actions">
              <button class="btn btn-primary btn-lg" id="submit-btn" type="submit">
                Khởi tạo lá số
              </button>
              <button class="btn btn-secondary" id="sample-btn" type="button">
                Xem lá số mẫu
              </button>
              <button class="btn btn-link btn-sm" id="open-json-btn" type="button">
                Mở file lá số JSON
              </button>
              <input type="file" id="json-file-input" accept=".json" style="display: none;" />
            </div>
          </form>
        </div>
      </div>
    </section>

    <!-- ======================================================================
         MÀN HÌNH 2: BÀN CỜ LÁ SỐ 4×4 (APPLE PRECISION WORKSPACE)
         ====================================================================== -->
    <section class="view-screen hidden" id="view-chart">
      <!-- Chart Screen Toolbar -->
      <div class="chart-screen-header">
        <button class="btn btn-secondary btn-sm" id="back-to-input-btn" type="button">
          ‹ Nhập dữ kiện khác
        </button>

        <div class="chart-toolbar-right">
          <button class="btn btn-primary btn-sm" id="top-goto-reading-btn" type="button">
            Dữ kiện lá số
          </button>

          <div class="view-mode-tabs segmented-control segmented-compact" role="tablist" aria-label="Chế độ xem bàn cờ">
            <button class="segmented-btn view-mode-tab active" data-mode="grid" type="button">Bàn cờ 4×4</button>
            <button class="segmented-btn view-mode-tab" data-mode="list" type="button">12 Cung</button>
          </div>
        </div>
      </div>

      <!-- Main Layout: Bàn Cờ 4×4 & Cột Chi Tiết Cung -->
      <div class="chart-layout">
        <!-- Bàn Cờ 4×4 -->
        <div class="board-column">
          <div class="board-container" id="board-container">
            <div class="chart-grid" id="chart-grid">
              <svg class="relations-svg-overlay" id="relations-svg"></svg>
              <!-- Hàng 1 -->
              <div class="palace-cell" data-branch="5" tabindex="0"></div>
              <div class="palace-cell" data-branch="6" tabindex="0"></div>
              <div class="palace-cell" data-branch="7" tabindex="0"></div>
              <div class="palace-cell" data-branch="8" tabindex="0"></div>

              <!-- Hàng 2 -->
              <div class="palace-cell" data-branch="4" tabindex="0"></div>
              <div class="center-cell" id="center-cell"></div>
              <div class="palace-cell" data-branch="9" tabindex="0"></div>

              <!-- Hàng 3 -->
              <div class="palace-cell" data-branch="3" tabindex="0"></div>
              <div class="palace-cell" data-branch="10" tabindex="0"></div>

              <!-- Hàng 4 -->
              <div class="palace-cell" data-branch="2" tabindex="0"></div>
              <div class="palace-cell" data-branch="1" tabindex="0"></div>
              <div class="palace-cell" data-branch="0" tabindex="0"></div>
              <div class="palace-cell" data-branch="11" tabindex="0"></div>
            </div>
          </div>

          <!-- Danh sách card cho mobile -->
          <div class="mobile-card-list" id="mobile-card-list"></div>
        </div>

        <!-- Cột Chi Tiết Cung Bên Phải (macOS Inspector Sidebar) -->
        <aside class="details-panel" aria-label="Chi tiết cung vị">
          <div class="details-panel-header">Chi tiết cung vị</div>
          <div id="details-body"></div>
        </aside>
      </div>

      <div id="chart-verification" class="verification-wrapper"></div>
      <div class="reading-action-bar">
        <button class="btn btn-primary btn-reading-huge" id="goto-reading-btn" type="button">
          Xem dữ kiện &amp; phân tích lá số ›
        </button>
      </div>
    </section>

    <!-- ======================================================================
         MÀN HÌNH 3: DỮ KIỆN LÁ SỐ & LỚP MODEL
         ====================================================================== -->
    <section class="view-screen hidden" id="view-reading">
      <div class="chart-screen-header">
        <button class="btn btn-secondary btn-sm" id="back-to-chart-btn" type="button">
          ‹ Quay lại bàn cờ
        </button>
        <span class="toolbar-title">Dữ kiện lá số</span>
      </div>

      <div class="reading-screen-wrapper" id="reading-container"></div>
    </section>

    <!-- Xác nhận phương án giờ sinh (Apple Centered Sheet) -->
    <div class="modal-backdrop hidden" id="scenario-modal">
      <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="scenario-modal-title">
        <div class="modal-header">
          <div class="modal-title" id="scenario-modal-title">Xác nhận giờ sinh</div>
          <button class="btn-icon-close" id="scenario-modal-close" type="button" aria-label="Đóng phần xác nhận giờ sinh">✕</button>
        </div>
        <div class="modal-body" id="scenario-modal-body"></div>
      </div>
    </div>

  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
